<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Life Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Daily Life Tracker</h1>
    <p class="subtitle">Build habits that actually stick.</p>

    <form id="habit-form">
      <input type="text" id="habit-name" placeholder="Add a habit (e.g. Read, Exercise)" required>
      <button type="submit">Add Habit</button>
    </form>

    <div id="habit-list"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
